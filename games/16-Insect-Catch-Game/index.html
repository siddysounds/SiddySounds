<div class="screen">
<h1>Catch The Insect</h1>
<button class="btn" id="start-btn">Play Game</button>
</div>
<div class="screen">
<h1>What is your "favorite" insect?</h1>
<ul class="insects-list">
<li>
<button class="choose-insect-btn">
<p>Fly</p>
<img alt="fly" src="https://pngimg.com/uploads/fly/fly_PNG3946.png"/>
</button>
</li>
<li>
<button class="choose-insect-btn">
<p>Mosquito</p>
<img alt="mosquito" src="https://pngimg.com/uploads/mosquito/mosquito_PNG18175.png"/>
</button>
</li>
<li>
<button class="choose-insect-btn">
<p>Spider</p>

</button>
</li>
<li>
<button class="choose-insect-btn">
<p>Roach</p>
<img alt="roach" src="https://pngimg.com/uploads/roach/roach_PNG12163.png"/>
</button>
</li>
</ul>
</div>
<div class="screen game-container" id="game-container">
<h3 class="time" id="time">Time: 00:00</h3>
<h3 class="score" id="score">Score: 0</h3>
<h5 class="message" id="message">

      </h5>
