<body>
<h1>Simon Says Game</h1>
<div id="game-container">
<div aria-label="Green" class="color-btn" id="green" role="button" tabindex="0"></div>
<div aria-label="Red" class="color-btn" id="red" role="button" tabindex="0"></div>
<div aria-label="Yellow" class="color-btn" id="yellow" role="button" tabindex="0"></div>
<div aria-label="Blue" class="color-btn" id="blue" role="button" tabindex="0"></div>
</div>
<div id="game-status">
<p class="my-text" id="sequence" style="display: none;">
        Current Sequence: <span id="sequence-display">-</span>
</p>
<p class="my-text" id="clicks" style="display: none;">
        Click Count: <span id="click-count">0</span>
</p>
<p class="my-text" id="status-row" style="display: none;">
        Game Status: <span id="status">Waiting...</span>
</p>
</div>
<button id="start-btn">Start Game</button>
<p id="level-message" style="display: none;"></p>
<script defer="" src="/js/privacy.js"></script></body>
